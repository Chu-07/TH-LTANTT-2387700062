{% extends "layout.html" %}

{% block content %}

<form method="POST" action="/scan">

    <label>Target IP:</label>
    <input
        type="text"
        name="target"
        value="127.0.0.1"
        required
    >

    <br>

    <label>Ports:</label>
    <input
        type="text"
        name="ports"
        value="22,80,443"
    >

    <br>

    <label>Mode:</label>

    <select name="mode">

        <option value="all">
            All
        </option>

        <option value="scan">
            Port Scan
        </option>

        <option value="service">
            Service Detection
        </option>

        <option value="banner">
            Banner Grab
        </option>

        <option value="map">
            Network Map
        </option>

        <option value="vuln">
            Vulnerability Check
        </option>

    </select>

    <br>

    <label>Email nhận kết quả:</label>

    <input
        type="email"
        name="email"
    >

    <br>

    <button type="submit">
        Scan
    </button>

</form>

{% endblock %}
