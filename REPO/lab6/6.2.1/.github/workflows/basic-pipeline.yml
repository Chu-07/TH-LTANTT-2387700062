name: Basic CI/CD
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build-job:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Hello, $GITHUB_ACTOR!"
  test-job1:
    needs: build-job
    runs-on: ubuntu-latest
    steps:
      - run: echo "This job tests something"
  test-job2:
    needs: build-job
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "This job tests something, but takes more time than test-job1."
          echo "This test runs 20 seconds longer than test-job1"
          sleep 20
  deploy-prod:
    needs: [test-job1, test-job2]
    runs-on: ubuntu-latest
    steps:
      - run: echo "This job simulates deployment from the $GITHUB_REF_NAME branch."
