stages:
  - build
  - deploy

build-job:
  stage: build
  image: node:22
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - build/

pages:
  stage: deploy
  image: alpine:3.20
  needs:
    - job: build-job
      artifacts: true
  script:
    - mv build/ public/
  pages: true
  artifacts:
    paths:
      - public/
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
